<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Culpa Capital</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="script.js" defer></script>
  <link rel="shortcut icon" href="Recursos/LogoNegro.png">
</head>

<body>

  <!-- DIANA: BARRA DE NAVEGACIÓN -->
  <header class="header-flotante-container">
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">

        <!-- Logo -->
        <a class="navbar-brand" href="#inicio">
          <img src="./Recursos/LogoBlanco.png" alt="Logo de Culpa Capital" class="logo-culpa">
        </a>

        <!-- Botón para celulares -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
          aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">

          <!-- Botones de navegación -->
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="#inicio">Hamburguesas</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#nosotros">Quiénes somos</a>
            </li>
          </ul>

          <!-- Carrito -->
          <ul class="navbar-nav ms-lg-3">
            <li class="nav-item">
              <a class="nav-link nav-ordenar" href="#carrito">
                Carrito
              </a>
            </li>
          </ul>

        </div>
      </div>
    </nav>

    <!-- DIANA: ICONOS DE REDES SOCIALES, DEBAJO DE LOS BOTONES -->
    <div class="redes-sociales">
      <span aria-label="Instagram" title="Instagram">
        <i class="fa-brands fa-instagram"></i>
      </span>

      <span aria-label="Facebook" title="Facebook">
        <i class="fa-brands fa-facebook-f"></i>
      </span>

      <span aria-label="TikTok" title="TikTok">
        <i class="fa-brands fa-tiktok"></i>
      </span>

      <span aria-label="WhatsApp" title="WhatsApp">
        <i class="fa-brands fa-whatsapp"></i>
      </span>
    </div>

  </header>

  <!-- CONTENIDO PRINCIPAL DE LA PÁGINA -->
  <main>

    <!-- CRIS: SECCIÓN PRINCIPAL CON LAS DOS HAMBURGUESAS -->
    <section id="inicio">
      <!-- Cris agregará aquí su contenido -->
    </section>

    <!-- KEVIN: SECCIÓN QUIÉNES SOMOS -->
    <section id="nosotros">
      <!-- Kevin agregará aquí su contenido -->
    </section>

  </main>


  <!-- DIANA: FOOTER CULPA CAPITAL -->

  <footer class="footer-culpa">
    <div class="container">

      <div class="footer-contenido">

        <!-- Logo de la marca: no repetimos el nombre en texto -->
        <a href="#inicio" class="footer-logo">
          <img src="./Recursos/LogoBlanco.png" alt="Logo de Culpa Capital">
        </a>

        <!-- Llamado a la acción -->
        <div class="footer-contacto">
          <h2>¡WASAPEA YA!</h2>
          <p>Tu próximo antojo está a un mensaje.</p>
          <a href="https://wa.me/" target="_blank" rel="noopener noreferrer" class="boton-whatsapp">
            <i class="fa-brands fa-whatsapp"></i>
            Escríbenos
          </a>
        </div>

        <!-- Redes sociales -->
        <div class="footer-redes">
          <h3>Síguenos</h3>
          <div class="footer-iconos">
            <a href="#" aria-label="Instagram">
              <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="#" aria-label="Facebook">
              <i class="fa-brands fa-facebook-f"></i>
            </a>
            <a href="#" aria-label="TikTok">
              <i class="fa-brands fa-tiktok"></i>
            </a>
          </div>
        </div>

      </div>

      <div class="footer-derechos">
        <p>© 2026 · Todos los derechos reservados.</p>
      </div>

    </div>

  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
